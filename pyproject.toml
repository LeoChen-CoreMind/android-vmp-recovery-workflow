[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-vmp-recovery-workflow"
version = "0.1.0"
description = "Resumable Android DexVMP recovery workflow orchestrator"
requires-python = ">=3.10"

[project.scripts]
vmpwf = "vmpwf.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
